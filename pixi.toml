[workspace]
channels = ["conda-forge"]
name = "iss-profile-collection"
platforms = ["linux-64"]
version = "2025.3.1"

[system-requirements]
libc = "2.17"

[feature.profile.dependencies]
bluesky-base = "==1.14.6"
bluesky-queueserver = "*"
bluesky-queueserver-api = ">=0.0.12,<0.0.13"
bluesky-tiled-plugins = ">=2.0.0b68"
databroker = ">=2.0.0b8,<3"
epicscorelibs = ">=7.0.7.99.1.1,<8"
lmfit = ">=1.3.4,<2"
matplotlib = ">=3.10.8,<4"
nslsii = ">=0.11.6,<0.12"
opencv = ">=4.12.0,<5"
ophyd = ">=1.11.0"
ophyd-async = ">=0.13.7,<0.14"
pyepics = "*"
pyqt = ">=5.15.11,<6"
python = ">=3.12,<3.14"
scikit-learn = ">=1.8.0,<2"
tiled-client = ">=0.2.3,<0.3"
tiled-server = ">=0.2.3,<0.3"
xraydb = ">=4.5.8,<5"

[feature.terminal.dependencies]
ipython = ">=9.5.0"
numpy = ">2"

[feature.terminal.tasks]
start = "ipython --profile-dir=."
pvs = "ipython --profile-dir=. -c 'get_pv_types(); exit()'"

[environments]
terminal = {features=["profile", "terminal"], solve-group="profile"}